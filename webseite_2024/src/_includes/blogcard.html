<article
  class="blog-card{% if featured %} blog-card--featured{% endif %}"
  data-reveal
  data-category="{{ post.data.kategorie | displayCategory }}"
  data-search="{{ post.data.title }} {{ post.data.description }}"
>
  <a href="{{ post.url }}" class="blog-card-link">
    <div class="blog-card-image">
      {% if post.data.image %}<img src="{{ post.data.image }}" alt="" loading="lazy" />{% endif %}
      {% if post.data.kategorie %}<span class="blog-tag">{{ post.data.kategorie | displayCategory }}</span>{% endif %}
    </div>
    <div class="blog-card-body">
      <h3 class="blog-card-title">{{ post.data.title }}</h3>
      <p class="blog-card-desc">{{ post.data.description }}</p>
      <div class="blog-card-meta">{{ post.date | date("dd.MM.yyyy") }} · {{ post.templateContent | readingTime }} Min.</div>
    </div>
  </a>
</article>
