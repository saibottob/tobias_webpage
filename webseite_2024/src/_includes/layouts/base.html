<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ description }}" />
    <meta name="theme-color" content="#040a1c" />
    <title>{{ title }}</title>
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tobias Gatschet" />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta
      property="og:image"
      content="https://tobias-gatschet.ch{{ image or '/assets/images/hero-image.jpg' }}"
    />
    <meta property="og:url" content="https://tobias-gatschet.ch{{ page.url }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ title }}" />
    <meta name="twitter:description" content="{{ description }}" />
    <meta
      name="twitter:image"
      content="https://tobias-gatschet.ch{{ image or '/assets/images/hero-image.jpg' }}"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/site.css" />
    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "animejs": "/vendor/anime.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="scroll-progress" aria-hidden="true"></div>
    <header>{% include "basenavigation.html" %}</header>
    <main>{{ content | safe }}</main>

    {% include "footer.html" %}

    <script src="/vendor/motion.js"></script>
    <script type="module" src="/js/site.js"></script>
  </body>
</html>
